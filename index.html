<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>XP.RUN - Live Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0b0f19;
  color: #e5e9f0;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid #1f2933;
}

header img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

main {
  flex: 1;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  padding: 16px;
}

.card {
  background: #111827;
  border: 1px solid #1f2933;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.card h2 {
  margin: 0 0 10px;
  font-size: 17px;
}

/* SECTOR DE SELECTOR DE OS Y VMS */
.os-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.os-btn {
  flex: 1;
  margin-top: 0;
  padding: 10px;
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.os-btn.active {
  background: #2563eb;
  color: #ffffff;
  border-color: #3b82f6;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
}

.vm-container {
  width: 100%;
  height: 550px;
  background: #020617;
  border: 1px solid #1f2933;
  border-radius: 8px;
  overflow: hidden;
}

.vm-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: none;
}

.vm-frame.active {
  display: block;
}

.logs {
  background: #020617;
  border: 1px solid #1f2933;
  border-radius: 8px;
  padding: 10px;
  height: 180px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
  white-space: pre-wrap;
}

#chatBox {
  background: #020617;
  border: 1px solid #1f2933;
  border-radius: 8px;
  padding: 10px;
  height: 200px;
  overflow-y: auto;
  font-size: 13px;
}

input, button {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

footer {
  padding: 10px;
  text-align: center;
  font-size: 12px;
  color: #6b7280;
  border-top: 1px solid #1f2933;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="XP.RUN Logo">
  <div>
    <h1 style="margin:0; font-size:20px;">XP.RUN</h1>
    <small>Live Sandbox Monitor</small>
  </div>
</header>

<main>

  <!-- PANEL SANDBOX -->
  <section class="card">
    <h2>Sandbox View</h2>
    
    <!-- SELECTOR DE ENTORNO DE EJECUCIÓN -->
    <div class="os-selector">
      <button class="os-btn active" id="btn-win" onclick="switchOS('win')">🖥️ Windows Sandbox</button>
      <button class="os-btn" id="btn-android" onclick="switchOS('android')">📱 Android Sandbox</button>
    </div>

    <!-- CONTENEDOR DE MAQUINAS VIRTUALES -->
    <div class="vm-container">
      <iframe 
        id="vm-win"
        class="vm-frame active"
        src="https://www.apponfly.com/en/trial" 
        allow="fullscreen"
        title="Windows Sandbox">
      </iframe>

      <iframe 
        id="vm-android"
        class="vm-frame"
        src="https://appetize.io/embed/demo?device=nexus5&osVersion=8.1" 
        allow="fullscreen"
        title="Android Sandbox">
      </iframe>
    </div>

    <h3 style="margin-top:15px;">Logs</h3>
    <div class="logs" id="logsBox">[XP.RUN] Esperando datos...</div>
  </section>

  <!-- PANEL CHAT -->
  <section class="card">
    <h2>Chat en tiempo real</h2>
    <div id="chatBox">Cargando chat...</div>

    <input id="chatInput" placeholder="Escribe un mensaje o comando (/start, /stop, /capture)">
    <button onclick="sendMessage()">Enviar</button>
  </section>

</main>

<footer>
  XP.RUN · Powered by XPAnalyzer · GitHub Pages
</footer>

<script>
// =============================
// SELECTOR DE SISTEMA OPERATIVO
// =============================
function switchOS(os) {
  const winFrame = document.getElementById("vm-win");
  const androidFrame = document.getElementById("vm-android");
  const btnWin = document.getElementById("btn-win");
  const btnAndroid = document.getElementById("btn-android");

  if (os === 'win') {
    winFrame.classList.add("active");
    androidFrame.classList.remove("active");
    btnWin.classList.add("active");
    btnAndroid.classList.remove("active");
  } else if (os === 'android') {
    androidFrame.classList.add("active");
    winFrame.classList.remove("active");
    btnAndroid.classList.add("active");
    btnWin.classList.remove("active");
  }
}

// =============================
// LOGS EN VIVO
// =============================
async function updateLogs() {
  try {
    const res = await fetch("https://raw.githubusercontent.com/anyelo888ra-ux/XPAnalyzer-Demo/main/logs.txt?cache=" + Date.now());
    const text = await res.text();
    document.getElementById("logsBox").textContent = text;
  } catch {}
}
setInterval(updateLogs, 2000);
updateLogs();

// =============================
// CHAT EN VIVO
// =============================
async function loadChat() {
  try {
    const res = await fetch("https://raw.githubusercontent.com/anyelo888ra-ux/XPAnalyzer-Demo/main/chat.json?cache=" + Date.now());
    const chat = await res.json();
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    chat.forEach(m => {
      box.innerHTML += `<div><b>${m.user}:</b> ${m.msg}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  } catch {}
}
setInterval(loadChat, 2000);
loadChat();

// =============================
// ENVIAR MENSAJE
// =============================
function sendMessage() {
  const msg = document.getElementById("chatInput").value.trim();
  if (!msg) return;

  alert("⚠ Este HTML no puede escribir en GitHub.\nDebes usar tu script para agregar el mensaje:\n\n" + msg);

  document.getElementById("chatInput").value = "";
}
</script>

</body>
</html>
